[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filmpipe"
version = "0.1.0"
description = "Local film scan processing pipeline MVP foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ai = [
    "torch>=2.2",
    "PyYAML>=6.0",
    "albumentations>=1.4",
    "easydict>=1.9",
    "hydra-core>=1.3",
    "joblib>=1.4",
    "kornia>=0.7",
    "omegaconf>=2.3",
    "pandas>=2.2",
    "pytorch-lightning>=2.4",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "webdataset>=0.2",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
